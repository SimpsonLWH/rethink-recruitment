<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Synthetic illustration of the returns-flow rebuild">
  <rect width="1200" height="675" fill="#F7F5F0"/>
  <rect x="72" y="64" width="1056" height="547" rx="28" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="2"/>
  <text x="112" y="126" fill="#6B6B6B" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="3">SYNTHETIC DEMO · RETURNS FLOW</text>
  <text x="112" y="190" fill="#171717" font-family="Fraunces, Georgia, serif" font-size="44">Fewer steps. Fewer support calls.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="112" y="260" width="270" height="150" rx="18" fill="#F7F5F0" stroke="#E4E0D8"/>
