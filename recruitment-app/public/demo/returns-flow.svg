    <text x="492" y="350" fill="#171717" font-size="24">Pick the item</text>
    <rect x="492" y="372" width="160" height="10" rx="5" fill="#D9D9F2"/>
    <rect x="816" y="260" width="270" height="150" rx="18" fill="#F7F5F0" stroke="#E4E0D8"/>
