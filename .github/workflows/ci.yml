name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the Rivet app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recruitment-app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recruitment-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build with the synthetic seed
        run: npm run build
